name: telegramm_app
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  flutter_riverpod: ^3.0.3
  cloud_firestore: ^6.0.3
  provider: ^6.1.5+1
  mobile_scanner: ^7.1.3
  intl: ^0.20.2
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.1.12
  webview_flutter: ^4.2.2
  video_player: ^2.9.2
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_app.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/icon/
    - assets/images/
    - assets/emoji/